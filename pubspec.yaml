name: grace_match
description: "GraceMatch – Premium Telugu Christian Matrimony"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ────────────────────────────── 
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ─── Navigation & Deep Links ─────────────────────────
  go_router: ^15.1.2
  app_links: ^6.4.0

  # ─── Networking ───────────────────────────────────────
  dio: ^5.7.0
  # Both are already pulled in transitively by dio/flutter, but importing them
  # directly requires declaring them.
  http_parser: ^4.1.0   # MediaType, for setting a multipart part's Content-Type
  path: ^1.9.0          # basename/extension when building the upload part
  dio_smart_retry: ^6.0.0

  # ─── Dependency Injection ─────────────────────────────
  get_it: ^8.0.3

  # ─── Local Storage ────────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # ─── Firebase ─────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # ─── UI / Animations ──────────────────────────────────
  flutter_animate: ^4.5.2
  lottie: ^3.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.0
  flutter_svg: ^2.0.10+1

  # ─── Media ────────────────────────────────────────────
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # ─── Payments ─────────────────────────────────────────
  razorpay_flutter: ^1.4.4

  # ─── Utilities ────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1

  # ─── Fonts ────────────────────────────────────────────
  google_fonts: ^6.2.1
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

# ─── App icon ────────────────────────────────────────────────
# The two interlocking rings from the web site's brand mark, so the icon on a
# handset and the logo beside "GraceMatch" on the web are the same object.
#
# Sources live in tool/ rather than assets/ on purpose: they are build-time
# inputs, and assets/icons/ is a declared Flutter asset folder, so keeping two
# 1024px PNGs there would ship them inside the app for nothing.
#
# Regenerate after editing tool/app_icon/app_icon.svg:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "tool/app_icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true          # the App Store rejects icons with alpha
  # Adaptive icons are masked to a circle, squircle or squarcle depending on the
  # launcher, so the rings are inset into the 66% safe zone in this variant and
  # the tile colour is drawn behind rather than baked in.
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "tool/app_icon/app_icon_foreground.png"
